<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fa8c16"/>
      <stop offset="100%" stop-color="#d4380d"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#fff5e6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>

  <!-- Plate (circle) — symbolic dish -->
  <circle cx="64" cy="76" r="28" fill="url(#plateGrad)" opacity="0.95"/>
  <circle cx="64" cy="76" r="22" fill="none" stroke="#fa8c16" stroke-width="1.5" opacity="0.4"/>

  <!-- Letter M — for Mezbon — stylized as fork tines -->
  <path d="M 38 36 L 38 60 M 50 36 L 50 60 M 64 36 L 64 60 M 78 36 L 78 60 M 90 36 L 90 60"
        stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.0"/>

  <!-- Big "M" letter -->
  <text x="64" y="62" font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif"
        font-size="44" font-weight="800" fill="#fff" text-anchor="middle"
        letter-spacing="-2">M</text>

  <!-- Small dot detail on plate (steam/aroma) -->
  <circle cx="58" cy="72" r="2" fill="#fa8c16" opacity="0.6"/>
  <circle cx="64" cy="76" r="2.5" fill="#d4380d" opacity="0.7"/>
  <circle cx="70" cy="72" r="2" fill="#fa8c16" opacity="0.6"/>
</svg>
