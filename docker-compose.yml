version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: muhsina_somsa
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./muhsina_test.db:/app/muhsina_test.db
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - db
      - redis

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: always
    env_file: .env
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - api
      - db
      - redis

volumes:
  postgres_data:
